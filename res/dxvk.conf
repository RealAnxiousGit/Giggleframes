# DXVK settings for Giggleland, installed by Giggleframes next to Giggleland.exe when the
# Render API is set to Vulkan (DXVK), and removed again when you switch back.

# Build shaders from pre-compiled pieces where the driver supports it (VK_EXT_graphics_pipeline_library),
# so new objects coming into view don't hitch while their full pipelines compile.
dxvk.enableGraphicsPipelineLibrary = True

# Compile shaders on every core.
dxvk.numCompilerThreads = 0

# d3d11.relaxedBarriers = True was tried and measured no faster here (Rory's Rally, Intel iGPU),
# so it stays off: it can cause rendering errors.
